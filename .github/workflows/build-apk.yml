
name: Build Snake 100 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          mkdir extracted
          unzip -q Snake100_Android_Game_Files.zip -d extracted
          cp -a extracted/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake100-APK
          path: app/build/outputs/apk/debug/app-debug.apk
