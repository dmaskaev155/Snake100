
name: Build SNAKE 100 APK

on:
  push:
    paths:
      - 'Snake100_Android_Game_Files_v1.2.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract SNAKE 100 project
        run: |
          test -f Snake100_Android_Game_Files_v1.2.zip
          mkdir -p source
          unzip -q Snake100_Android_Game_Files_v1.2.zip -d source
          test -f source/gradlew
          chmod +x source/gradlew

      - name: Build APK
        working-directory: source
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE-100-v1.2-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
